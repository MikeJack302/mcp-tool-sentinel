[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-tool-sentinel"
version = "0.1.0"
description = "Offline MCP tool schema, annotation, and privilege-drift gates"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MikeJack302"}]
dependencies = []

[project.scripts]
mcp-tool-sentinel = "mcpsentinel.cli:main"

[tool.setuptools.packages.find]
include = ["mcpsentinel*"]
